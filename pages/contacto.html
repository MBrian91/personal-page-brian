    <main>
        <section>
            <h2>Contactate con nosotros</h2>
            <form action="" method="">
                <label for="nombreyapellido">Nombre y Apellido</label>
                <input type="text" id="nombreyapellido" required>
                <label for="tuemail">Ingresa tu Email</label>
                <input type="email" name="email" id="tuemail" required>
                <label for="tunumerodetel">Ingresa tu Numero de Telefono</label>
                <input type="number" id="tunumerodetel" required>
                <label for="mensaje">Dejanos tu mensaje</label>
                <textarea name="mensaje" id="mensaje" required minlength="20"></textarea>
                <button type="button">Enviar</button>
                <input type="reset">
            </form>
        </section>
